# ============================================
# BUILD
# ============================================
# GitHub Pages silently applies jekyll-theme-primer unless a theme key is present.
theme: null

plugins:
  - jekyll-sitemap   # not enabled by default on GitHub Pages; must be listed

# Keep static downloads out of the sitemap.
defaults:
  - scope:
      path: files
    values:
      sitemap: false

sass:
  style: compressed

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

# NOTE: on GitHub Pages (Jekyll 3.x) a user `exclude` REPLACES the built-in
# defaults rather than extending them, so Gemfile/Gemfile.lock/vendor must stay
# listed here explicitly even though Jekyll 4 would add them for you.
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - notebooks
  - SocialNetworks.ipynb
