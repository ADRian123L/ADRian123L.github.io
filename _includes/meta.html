<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip | escape }}" />
<meta name="author" content="{{ site.title | escape }}" />
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml" />
<link rel="apple-touch-icon" href="{{ '/images/profile.png' | relative_url }}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />

<meta property="og:site_name" content="{{ site.title | escape }}" />
<meta property="og:title" content="{{ page.title | default: site.title | escape }}" />
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip | escape }}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
{% if site.avatar %}<meta property="og:image" content="{{ site.avatar | absolute_url }}" />
<meta property="og:image:alt" content="Portrait of {{ site.title | escape }}" />{% endif %}

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />

<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}" />
<meta name="twitter:description" content="{{ page.description | default: site.description | strip_newlines | strip | escape }}" />
{% if site.avatar %}<meta name="twitter:image" content="{{ site.avatar | absolute_url }}" />{% endif %}
